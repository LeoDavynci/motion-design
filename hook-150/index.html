<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peepl hook: 150 people. Dunbar's number. The rest.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400&display=block" rel="stylesheet">
<style>
  /* Keyframes from Figma "Video Edits" (node 273:26847): Frames 1-3 (150 -> Dunbar's number) and Frames 16-19 (the
     dot grid). Background: the Figma frames' image (dark night with orange / pink and blue fields, grain included).
     Geist Regular, tracking -4%, white, lime #beff00 accents, text shadow 0 4px 24px black at 25%. Typing motion after
     the user's screen recording: letters fade and sharpen in, the caret jumps after each one, the line glides to stay
     centered; when a line leaves, its letters fade and blur away left to right while the line drifts left. */
  :root { --ink: #ffffff; --lime: #beff00; --caret: rgba(255, 255, 255, 0.55); }
  html, body { margin: 0; background: #1c1522; }
  #c { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #1c1522; }
  #bg { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  #dots, #text { position: absolute; inset: 0; }
  #dots b { position: absolute; width: 26px; height: 26px; border-radius: 50%; opacity: 0; }
  /* A line is laid out at 100px (Frames 2-3, 16-18) and scaled: 4.42x for Frame 1's 442px "150", 2.4x for Frame 19 */
  .line { position: absolute; left: 0; top: 0; white-space: pre; transform-origin: 0 0;
    font: 400 100px/0.9 'Geist', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.04em; color: var(--ink); }
  /* Inline (not inline-block) so the font's kerning still applies across letters, as in Figma */
  .line span { white-space: pre; }
  .line .lime { color: var(--lime); }
  .caret { position: absolute; top: -0.06em; width: 0.025em; height: 1.02em; background: var(--caret); }
</style>
</head>
<body>
<div id="c">
  <img id="bg" src="assets/bg.png" alt="">
  <div id="dots"></div>
  <div id="text"></div>
</div>
<script type="module">
import { clamp, track } from '../lib/motion.js';
import { GRID, GRID_STEP, SHIFT } from './dots.js';

// ---- Script ----
// 1. "150" typed big -> snap down -> " people." -> " Dunbar’s number." (lime)                   (Frames 1-3, 16)
// 2. Clears -> "That’s how many your brain can handle." -> the colorful grid appears, middle outward (Frame 17)
// 3. Clears -> "But what about the " -> a near-instant cut-zoom to 240px (the reference recording's cut) while the
//    grid's top half shifts up and its bottom half down -> "rest?" types in the zoomed view (lime)   (Frames 18-19)
// 4. Once the line is typed, a white grid fills the screen around the text, middle outward          (Frame 19)
// 5. Out: the text slides off to the left as it fades, then every dot fades out, inside outward; the film then
//    continues into Vince's "Meeting people is easy" shot (spliced on in post, see make_cut.sh)
const FADE = 0.09;             // each letter fades and sharpens in over this long
const TRACK = 4;               // -0.04em letter-spacing at 100px
const snapEase = (x) => (x < 0.5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2);   // hard in and out (quartic)
const smooth = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);     // cubic in and out
const easeOut = (x) => 1 - (1 - x) ** 3;

// Line 1: 150 snaps from 442px (Frame 1) to 100px: a middle ground between a zoom and a hard cut
const BIG = 4.42;
const SNAP = [1.7, 1.95];
// Line 3: after "But what about the " it cuts (almost) straight to 240px, then "rest?" is typed in the zoomed view
// (Frame 19: left edge of the finished line at -1282px, off screen)
const ZOOM_K = 2.4;
const ZOOM_LEFT = -1282;
const ZOOM = [12.5, 12.6];            // 0.1s: reads as a cut, with a frame or two of motion blur
const REST_AT = 12.75;               // "rest?" starts once the cut has landed
const SHIFT_T = [ZOOM[0] - 0.04, ZOOM[1] + 0.12]; // the grid opens up with the cut

const LINES = [
  { parts: [
      { text: '150', start: 0.55, every: 0.16 },
      { text: ' people.', start: 2.2, every: 0.065 },
      { text: ' Dunbar’s number.', start: 3.3, every: 0.062, lime: true },
    ],
    caretFrom: 0, clearAt: 5.4,
    scale: (t) => BIG + (1 - BIG) * snapEase(clamp((t - SNAP[0]) / (SNAP[1] - SNAP[0]))),
    beats: [SNAP] },
  { parts: [{ text: 'That’s how many your brain can handle.', start: 6.2, every: 0.052 }],
    caretFrom: 6.0, clearAt: 10.4 },
  { parts: [
      { text: 'But what about the ', start: 11.25, every: 0.058 },
      { text: 'rest?', start: REST_AT, every: 0.075, lime: true },
    ],
    caretFrom: 11.05, clearAt: 15.6, slideOut: true,
    scale: (t) => 1 + (ZOOM_K - 1) * snapEase(clamp((t - ZOOM[0]) / (ZOOM[1] - ZOOM[0]))),
    beats: [ZOOM] },
];
// Leaving: letters fade and blur away left to right (EXIT_STEP apart, EXIT_FADE each) while the line drifts left
const EXIT_STEP = 0.014, EXIT_FADE = 0.22, EXIT_DRIFT = 110;
// The last line leaves differently: the whole line slides off to the left while it fades
const SLIDE = { dist: 1500, dur: 0.75 };
// Dots appear (no movement): one by one by distance from the text's middle, each fading in quickly
const GRID_IN = [8.45, 1.0];         // start, spread (s): once "That’s how many your brain can handle." is typed
const WHITE_IN = [REST_AT + 4 * 0.075 + 0.25, 1.2]; // once "rest?" is fully typed
const DOT_FADE = 0.13;
// Out: after the text has gone, every dot fades out, inside outward (the same order they came in)
const DOTS_OUT = [15.6 + SLIDE.dur - 0.15, 1.0];
const DURATION = DOTS_OUT[0] + DOTS_OUT[1] + 0.15 + 0.25;

// ---- Build ----
const stage = document.getElementById('text');
const lines = LINES.map((L) => {
  const el = document.createElement('div');
  el.className = 'line';
  const caret = document.createElement('i');
  caret.className = 'caret';
  el.appendChild(caret);
  stage.appendChild(el);
  const chars = [];
  for (const p of L.parts) [...p.text].forEach((ch, i) => chars.push({ ch, at: p.start + i * p.every, lime: !!p.lime }));
  const spans = chars.map((c) => {
    const sp = document.createElement('span');
    sp.textContent = c.ch;
    if (c.lime) sp.className = 'lime';
    el.insertBefore(sp, caret);
    return sp;
  });
  const exitEnd = L.slideOut ? L.clearAt + SLIDE.dur : L.clearAt + (chars.length - 1) * EXIT_STEP + EXIT_FADE;
  return { ...L, el, caret, chars, spans, exitEnd, widths: [0] };
});

// Dots: one element each, centered on its position; delay = distance from the text's middle (960, 540)
const dotLayer = document.getElementById('dots');
const mkDot = (x, y, color, op) => {
  const d = document.createElement('b');
  d.style.left = `${x - 13}px`;
  d.style.top = `${y - 13}px`;
  d.style.background = color;
  dotLayer.appendChild(d);
  return { d, x, y, op };
};
const byDistance = (dots, spread, key = 'delay', at = (p) => [p.x, p.y]) => {
  const ds = dots.map((p) => Math.hypot(at(p)[0] - 960, at(p)[1] - 540));
  const lo = Math.min(...ds), hi = Math.max(...ds);
  dots.forEach((p, i) => (p[key] = ((ds[i] - lo) / (hi - lo)) * spread));
};
const grid = GRID.map(([x, y, c]) => mkDot(x, y, c, 0.9));
byDistance(grid, GRID_IN[1]);
// White lattice (Frame 19): the same 53 x 39 steps over the whole screen, around the opened-up colorful grid,
// leaving the band around the text empty. Rows are where the shifted colorful rows put them.
const cols = [], rowsAll = [], rowsSide = [];
for (let x = GRID[0][0] - 9 * GRID_STEP.x; x <= 1920 + 13; x += GRID_STEP.x) cols.push(x);
const shiftedTop = [...new Set(GRID.filter((g) => g[1] < 540).map((g) => g[1] + SHIFT.up))].sort((a, b) => a - b);
const shiftedBottom = [...new Set(GRID.filter((g) => g[1] > 540).map((g) => g[1] + SHIFT.down))].sort((a, b) => a - b);
for (let y = shiftedTop[0] - GRID_STEP.y; y >= -13; y -= GRID_STEP.y) rowsAll.push(y);
for (let y = shiftedBottom.at(-1) + GRID_STEP.y; y <= 1080 + 13; y += GRID_STEP.y) rowsAll.push(y);
rowsSide.push(...shiftedTop, ...shiftedBottom);
const gx0 = Math.min(...GRID.map((g) => g[0])), gx1 = Math.max(...GRID.map((g) => g[0]));
const whiteSpots = [];
for (const x of cols) {
  for (const y of rowsAll) whiteSpots.push([x, y]);
  if (x < gx0 - 1 || x > gx1 + 1) for (const y of rowsSide) whiteSpots.push([x, y]);
}
const white = whiteSpots.map(([x, y]) => mkDot(x, y, '#ffffff', 0.6));
byDistance(white, WHITE_IN[1]);
// Fading out goes by where everything is at the end (the colorful rows shifted), all dots together, inside outward
const all = [...grid, ...white];
byDistance(all, DOTS_OUT[1], 'outDelay', (p) => [p.x, grid.includes(p) ? p.y + (p.y < 540 ? SHIFT.up : SHIFT.down) : p.y]);

// ---- Paint frame t ----
window.seek = (t) => {
  const active = lines.findIndex((L) => t >= L.caretFrom && t < L.clearAt);
  lines.forEach((L, li) => {
    let n = 0;
    while (n < L.chars.length && L.chars[n].at <= t) n++;
    const k = L.scale ? L.scale(t) : 1;
    // Text shadow (Figma: 0 4px 24px black 25%), divided by the line's scale so it looks the same at every size
    const drop = `0 ${(4 / k).toFixed(2)}px ${(24 / k).toFixed(2)}px rgba(0, 0, 0, 0.25)`;
    L.chars.forEach((c, i) => {
      const a = clamp((t - c.at) / FADE);
      const out = L.slideOut ? 0 : clamp((t - (L.clearAt + i * EXIT_STEP)) / EXIT_FADE);
      const e = easeOut(a) * (1 - easeOut(out));
      const blur = a < 1 ? (1 - easeOut(a)) * 6 : out > 0 ? easeOut(out) * 10 : 0;
      const sp = L.spans[i];
      sp.style.opacity = e.toFixed(3);
      sp.style.color = blur > 0.01 ? 'transparent' : '';
      sp.style.textShadow = blur > 0.01 ? `0 0 ${blur.toFixed(2)}px ${c.lime ? 'var(--lime)' : 'var(--ink)'}, ${drop}` : drop;
    });
    // The line glides to stay centered: a spring toward -width/2 after each key (stacked springs, pure in t).
    // Centered as Figma does it: the last letter's (negative) letter-spacing isn't part of the line's width.
    const keys = [[0, 0], ...L.chars.map((c, i) => [c.at, -(L.widths[i + 1] + TRACK) / 2])];
    const off = track(t, keys, 140, 24);
    // Leaving: the whole line drifts left while its letters fade (screen px)
    const leave = clamp((t - L.clearAt) / (L.exitEnd - L.clearAt));
    const drift = L.slideOut ? -SLIDE.dist * leave ** 2.2 : -EXIT_DRIFT * smooth(leave);
    L.el.style.opacity = L.slideOut ? (1 - smooth(leave)).toFixed(3) : '1';
    // Line 3 zooms toward "rest?": a pan that grows with the zoom lands its left edge where Frame 19 has it
    let pan = 0;
    if (li === 2) {
      const W = L.widths[L.chars.length] + TRACK;
      const panEnd = ZOOM_LEFT - 960 + (ZOOM_K * W) / 2;
      pan = (panEnd * (k - 1)) / (ZOOM_K - 1);
    }
    L.el.style.transform = `translate(${960 + pan + drift}px, 540px) scale(${k}) translate(${off}px, -50%)`;
    // Caret: right after the last letter; solid while typing (and through a snap), blinking (1s) when idle
    L.caret.style.left = `${L.widths[n] + 4}px`;
    const snapped = (L.beats ?? []).reduce((m, [a, b]) => (t >= a ? Math.max(m, Math.min(t, b)) : m), 0);
    const last = Math.max(n ? L.chars[n - 1].at : L.caretFrom, snapped);
    const idle = t - last;
    const blinkOn = idle < 0.45 || ((idle - 0.45) % 1.0) >= 0.5;
    L.caret.style.opacity = li === active && blinkOn ? '1' : '0';
  });
  // Colorful grid: each dot fades in on its delay; with the zoom, the top half shifts up and the bottom half down
  const s = smooth(clamp((t - SHIFT_T[0]) / (SHIFT_T[1] - SHIFT_T[0])));
  const gone = (p) => 1 - clamp((t - DOTS_OUT[0] - p.outDelay) / DOT_FADE);
  grid.forEach((g) => {
    g.d.style.opacity = (clamp((t - GRID_IN[0] - g.delay) / DOT_FADE) * gone(g) * g.op).toFixed(3);
    g.d.style.transform = `translateY(${((g.y < 540 ? SHIFT.up : SHIFT.down) * s).toFixed(2)}px)`;
  });
  // White grid: each dot fades in on its delay, in place
  white.forEach((w) => {
    w.d.style.opacity = (clamp((t - WHITE_IN[0] - w.delay) / DOT_FADE) * gone(w) * w.op).toFixed(3);
  });
};
window.DURATION = DURATION;

window.ready = (async () => {
  await document.fonts.load("400 100px 'Geist'");
  await document.fonts.ready;
  await document.getElementById('bg').decode();
  // From the rendered letters themselves (layout ignores their opacity / blur), so centering matches exactly
  for (const L of lines) {
    L.el.style.transform = 'none';
    const left = L.el.getBoundingClientRect().left;
    L.widths = [0, ...L.spans.map((sp) => sp.getBoundingClientRect().right - left)];
  }
  window.seek(0);
})();

// Live preview when opened in a browser (?play): loops in real time. The render never uses this.
if (new URLSearchParams(location.search).has('play')) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = (now) => { window.seek(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
